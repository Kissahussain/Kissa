<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graphic Designs — Kissa Hussain</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; cursor: url('/star.svg') 10 10, auto; }

    body {
      font-family: 'Inter', sans-serif;
      background: url('/mymind-wHJ5L9KGTl4-unsplash.jpg') center center / cover no-repeat fixed;
      color: #f5f0e8;
      min-height: 100vh;
      padding: 48px 24px;
    }

    a { color: inherit; text-decoration: none; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1100px;
      margin: 0 auto 64px;
    }

    .brand {
      font-weight: 700;
      font-size: 22px;
      letter-spacing: -0.03em;
      color: #fefef9;
    }

    .back-link {
      font-size: 13px;
      color: #F2CCB4;
      transition: color 0.2s;
    }

    .back-link:hover { color: #fefef9; }

    .page-title {
      text-align: center;
      max-width: 700px;
      margin: 0 auto 16px;
    }

    .page-title h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      line-height: 1.15;
      color: #F2CCB4;
    }

    .page-title p {
      margin-top: 14px;
      color: #fefef9;
      font-size: 1rem;
      opacity: 0.7;
    }

    .divider {
      width: 48px;
      height: 2px;
      background: #0145c3;
      margin: 32px auto 48px;
    }

    /* upload button — hidden until Shift+K */
    .upload-area {
      max-width: 1100px;
      margin: 0 auto 40px;
      display: none;
      justify-content: center;
    }

    .upload-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.12);
      border: 2px dashed rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 999px;
      padding: 14px 32px;
      color: #fefef9;
      font-size: 0.95rem;
      font-weight: 600;
      transition: background 0.2s, border-color 0.2s;
    }

    .upload-btn:hover {
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.6);
    }

    .upload-btn .plus { font-size: 1.5rem; color: #F2CCB4; line-height: 1; }

    .gallery {
      max-width: 1100px;
      margin: 0 auto;
      columns: 3 260px;
      column-gap: 16px;
    }

    .gallery-item {
      break-inside: avoid;
      margin-bottom: 16px;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .gallery-item img {
      width: 100%;
      display: block;
      transition: transform 0.4s ease;
    }

    .gallery-item:hover img { transform: scale(1.03); }

    .remove-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 1.1rem;
      display: none;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .gallery-item:hover .remove-btn { opacity: 1; }

    footer {
      text-align: center;
      margin-top: 96px;
      color: #FB3539;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <header>
    <a class="brand" href="/">KH</a>
    <a class="back-link" href="/#case-studies">← Back to portfolio</a>
  </header>

  <div class="page-title">
    <h1>Graphic Designs</h1>
    <p>A collection of visual work across illustration, branding, and editorial design.</p>
  </div>
  <div class="divider"></div>

  <div class="upload-area" id="upload-area">
    <label class="upload-btn">
      <span class="plus">+</span> Add Images
      <input type="file" id="file-input" multiple accept="image/*" style="display:none" />
    </label>
  </div>

  <main class="gallery" id="gallery"></main>

  <footer>
    <p>© 2026 Kissa Hussain</p>
  </footer>

  <script>
    // ── Hardcoded images (visible to everyone) ──
    const IMAGES = [
      '1.png','2.png','3.png','6.png','7.png','8.png','9.png','10.png',
      '11.png','12.png','13.png','14.png','15.png','16.png','18.png','19.png',
      '20.png','21.png','22.png','23.png','24.png','25.png','26.png','27.png',
      '28.png','29.png','30.png',
    ];

    // ── IndexedDB for private uploads (Shift+K admin mode) ──
    const DB_NAME = 'kh-graphic-designs';
    const STORE   = 'images';
    let db;

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = e => e.target.result.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
        req.onsuccess = e => resolve(e.target.result);
        req.onerror   = e => reject(e);
      });
    }

    function saveImage(dataUrl, name) {
      return new Promise((resolve, reject) => {
        const req = db.transaction(STORE, 'readwrite').objectStore(STORE).add({ dataUrl, name });
        req.onsuccess = () => resolve(req.result);
        req.onerror   = e => reject(e);
      });
    }

    function deleteImage(id) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).delete(id);
        tx.oncomplete = resolve;
        tx.onerror    = reject;
      });
    }

    function getAllImages() {
      return new Promise((resolve, reject) => {
        const req = db.transaction(STORE, 'readonly').objectStore(STORE).getAll();
        req.onsuccess = () => resolve(req.result);
        req.onerror   = e => reject(e);
      });
    }

    function readFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload  = e => resolve(e.target.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // ── Admin mode ──
    const ADMIN_KEY = 'kh-admin';
    const isAdmin   = () => sessionStorage.getItem(ADMIN_KEY) === '1';

    function applyAdminMode() {
      const show = isAdmin();
      document.getElementById('upload-area').style.display = show ? 'flex' : 'none';
      document.querySelectorAll('.remove-btn').forEach(btn => btn.style.display = show ? 'flex' : 'none');
    }

    document.addEventListener('keydown', e => {
      if (e.shiftKey && e.key === 'K') {
        sessionStorage.setItem(ADMIN_KEY, isAdmin() ? '0' : '1');
        applyAdminMode();
      }
    });

    // ── Render helpers ──
    const gallery = document.getElementById('gallery');

    function addStaticImage(filename) {
      const item = document.createElement('div');
      item.className = 'gallery-item';
      const img = document.createElement('img');
      img.src = '/' + filename;
      img.alt = filename;
      item.appendChild(img);
      gallery.appendChild(item);
    }

    function addUploadedImage(id, dataUrl, name) {
      const item = document.createElement('div');
      item.className = 'gallery-item';
      const img = document.createElement('img');
      img.src = dataUrl;
      img.alt = name;
      const btn = document.createElement('button');
      btn.className = 'remove-btn';
      btn.textContent = '×';
      btn.title = 'Remove';
      btn.style.display = isAdmin() ? 'flex' : 'none';
      btn.onclick = async () => { await deleteImage(id); item.remove(); };
      item.appendChild(img);
      item.appendChild(btn);
      gallery.appendChild(item);
    }

    async function init() {
      // render hardcoded images first
      IMAGES.forEach(addStaticImage);

      // load private uploads from IndexedDB
      db = await openDB();
      const saved = await getAllImages();
      saved.forEach(({ id, dataUrl, name }) => addUploadedImage(id, dataUrl, name));

      applyAdminMode();

      document.getElementById('file-input').addEventListener('change', async e => {
        for (const file of Array.from(e.target.files)) {
          const dataUrl = await readFile(file);
          const id      = await saveImage(dataUrl, file.name);
          addUploadedImage(id, dataUrl, file.name);
        }
        e.target.value = '';
      });
    }

    init();
  </script>

</body>
</html>
